name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys main after the checks pass — through a Vercel Deploy Hook, so it works whoever wrote the commit — then waits
  # until the new version is live and wakes the bot, which sends «🆕 Бот оновлено» at once. Needs the repository secret
  # VERCEL_DEPLOY_HOOK (Vercel → Settings → Git → Deploy Hooks, branch main) and the variable BOT_URL
  # (https://<project>.vercel.app); without them these steps are skipped.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Several bots from this repository: put one hook (and one bot address) per line in the same secret / variable.
      - name: Deploy to Vercel
        env:
          HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOKS" ]; then echo "VERCEL_DEPLOY_HOOK is not set — skipping the deploy"; exit 0; fi
          n=0
          for hook in $HOOKS; do n=$((n + 1)); if curl -fsS -o /dev/null -X POST "$hook"; then echo "deploy $n started"; else echo "deploy $n: the hook did not answer"; fi; done
      - name: Wait for the new version and wake each bot
        env:
          HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          BOTS: ${{ vars.BOT_URL }}
        run: |
          if [ -z "$HOOKS" ] || [ -z "$BOTS" ]; then echo "VERCEL_DEPLOY_HOOK or BOT_URL is not set — skipping"; exit 0; fi
          for bot in $BOTS; do
            bot="${bot%/}"
            for i in $(seq 1 24); do
              if curl -fsS "$bot/api/health" | grep -q "\"commit\":\"$GITHUB_SHA\""; then echo "$bot: live after $((i * 15)) s"; break; fi
              sleep 15
            done
            curl -sS -o /dev/null -w "$bot wake: %{http_code}\n" "$bot/api/setup" || true
          done
