name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys main to each bot after the checks pass, then wakes it so it sends «🆕 Бот оновлено» at once. One repository
  # secret, VERCEL_DEPLOY — one line per bot (without it these steps are skipped; nothing is set up on Vercel's side):
  #   <Vercel token> <project name> <bot address>   e.g.  vcp_abc… ai-secretary https://ai-secretary.vercel.app
  # (a Deploy Hook URL on a line works too). CI uploads this code with the Vercel CLI, like a manual `vercel deploy --prod`.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy each bot and wake it
        env:
          DEPLOYS: ${{ secrets.VERCEL_DEPLOY }}
          OLD_HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          OLD_BOTS: ${{ vars.BOT_URL }}
        run: |
          if [ -z "$DEPLOYS$OLD_HOOKS" ]; then echo "VERCEL_DEPLOY is not set — skipping the deploy"; exit 0; fi
          wake() {
            # A hook deploys in the background: wait until this commit is live, then open /api/setup.
            for i in $(seq 1 24); do
              if curl -fsS "$1/api/health" | grep -q "\"commit\":\"$GITHUB_SHA\""; then break; fi
              [ "$2" = wait ] || break
              sleep 15
            done
            curl -sS -o /dev/null -w "$1 wake: %{http_code}\n" "$1/api/setup" || true
          }
          printf '%s\n%s\n' "$DEPLOYS" "$OLD_HOOKS" | while read -r first project bot; do
            [ -z "$first" ] && continue
            case "$first" in
              https://*)
                if curl -fsS -o /dev/null -X POST "$first"; then echo "hook: deploy started"; else echo "hook: did not answer"; fi ;;
              *)
                rm -rf .vercel
                if npx --yes vercel link --yes --project "$project" --token "$first" > /dev/null 2>&1 \
                  && npx --yes vercel deploy --prod --yes --token "$first" > /dev/null 2>&1; then
                  echo "$project: deployed"
                  [ -n "$bot" ] && wake "${bot%/}" now
                else
                  echo "$project: deploy failed — check the token and the project name"
                fi ;;
            esac
          done
          for bot in $OLD_BOTS; do wake "${bot%/}" wait; done
