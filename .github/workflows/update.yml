name: Update from Mem341/aisecretary

# Runs only in a copy of the bot: the GitHub repository that Vercel's «Deploy» button (or a deploying agent) created
# and connected to Vercel, or a fork (GitHub keeps Actions off in a fork until its owner turns them on in «Actions»).
# Every 5 minutes it takes the new version of main of github.com/Mem341/aisecretary and brings it here, but only once its
# checks have passed. Vercel builds every push to this copy by itself, and the bot then says «🆕 Бот оновлено».
# No token and no secret are involved: the job uses its own GITHUB_TOKEN. The .github folder stays as it is, because a
# job's token cannot change workflows.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    if: github.repository != 'Mem341/aisecretary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api() { curl -fsS -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" "$@"; }
          git fetch --depth=1 https://github.com/Mem341/aisecretary.git main
          sha=$(git rev-parse FETCH_HEAD)
          # Only the tests decide (the source's own scheduled runs leave many «skipped» marks on the same commit).
          runs=$(api "https://api.github.com/repos/Mem341/aisecretary/commits/$sha/check-runs?check_name=test&per_page=100") || { echo "GitHub did not answer — next time"; exit 0; }
          if ! echo "$runs" | jq -e '(.check_runs | length > 0) and all(.check_runs[]; .status == "completed" and .conclusion == "success")' > /dev/null; then
            echo "The new version's tests have not passed yet — next time"; exit 0
          fi
          # A fork syncs like GitHub's «Sync fork» button: same history, no extra commit. GitHub refuses when the update
          # touches workflows or conflicts — then the files are copied as for any other copy.
          repo=$(api "https://api.github.com/repos/$GITHUB_REPOSITORY" || echo '{}')
          if [ "$(echo "$repo" | jq -r '.fork // false')" = "true" ]; then
            branch=$(echo "$repo" | jq -r '.default_branch')
            if api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/merge-upstream" -d "{\"branch\":\"$branch\"}"; then
              echo; echo "Fork synced to ${sha:0:7}: Vercel deploys it now"; exit 0
            fi
            echo "Sync fork refused — copying the files instead"
          fi
          # The source's files, except workflows: changed, added and deleted ones alike.
          git restore --source=FETCH_HEAD --staged --worktree -- . ':(exclude).github'
          if git diff --cached --quiet; then echo "Up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update from Mem341/aisecretary ${sha:0:7}"
          git push
          echo "Updated to ${sha:0:7}: Vercel deploys it now"
