name: Wake the bot after a deploy

# Vercel reports every deploy of a Git-connected project back to GitHub. As soon as a production deploy succeeds, this
# opens the bot's /api/setup: the new version wakes up at once and tells the owner «🆕 Бот оновлено» — without waiting
# for the owner's next message. No token, no secret.
#
# The deploy's own address («<project>-<hash>-<team>.vercel.app») is usually behind Vercel's login, the production
# addresses are not: «<project>-<team>.vercel.app» and «<project>.vercel.app». Only an address whose /api/health
# reports this very commit is woken — never somebody else's project.
on: deployment_status

permissions: {}

jobs:
  wake:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Find the bot and open its /api/setup
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          SHA: ${{ github.event.deployment.sha }}
          BOT_URL: ${{ vars.BOT_URL }}
        run: |
          host=$(printf '%s' "$DEPLOY_URL" | sed -E 's#^https?://##; s#/.*$##')
          project=$(printf '%s' "$host" | sed -nE 's#^(.+)-[a-z0-9]{9}-(.+)\.vercel\.app$#\1#p')
          team=$(printf '%s' "$host" | sed -nE 's#^(.+)-[a-z0-9]{9}-(.+)\.vercel\.app$#\2#p')
          candidates="$BOT_URL"
          [ -n "$project" ] && candidates="$candidates https://$project-$team.vercel.app https://$project.vercel.app"
          candidates="$candidates https://$host"
          # The production address may move to the new version a few seconds after the report: try for two minutes.
          for attempt in $(seq 1 12); do
            for url in $candidates; do
              url="${url%/}"
              health=$(curl -sS --max-time 20 -w '\n%{http_code}' "$url/api/health" 2>&1 || true)
              code=$(printf '%s' "$health" | tail -n 1)
              if printf '%s' "$health" | grep -q "\"commit\":\"$SHA\""; then
                setup=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$url/api/setup" || echo "000")
                echo "$url: woken ($setup)"
                exit 0
              fi
              echo "try $attempt — $url: HTTP $code, $(printf '%s' "$health" | head -n 1 | grep -o '"commit":"[0-9a-f]\{7\}' || echo 'no commit')"
            done
            sleep 10
          done
          echo "Could not reach the bot; it tells what is new at its next wake-up instead"
